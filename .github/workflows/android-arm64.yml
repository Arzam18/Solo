name: Build Solo for Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    name: Build Solo Android ARM64 NEON
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          NDK_ARCHIVE="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip \
            --output "$NDK_ARCHIVE"
          unzip -q "$NDK_ARCHIVE" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Build and verify Solo
        shell: bash
        run: bash ./scripts/build-android.sh

      - name: Upload Android ARM64 executable
        uses: actions/upload-artifact@v4
        with:
          name: Solo-Android-ARM64-NEON
          path: |
            dist/Solo-Android-ARM64-NEON
            dist/Solo-Android-ARM64-NEON.sha256
          if-no-files-found: error
          retention-days: 30
